name: Quality Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax check
        run: python -m py_compile bot.py voice_player.py
      - name: Node syntax check
        run: |
          node --check java-bot.js
          node --check afk_client.js
          node --check bedrock-bot.js
